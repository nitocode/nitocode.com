<!doctype html>
<!-- Gabarit des images d'aperçu (1200x630). Rendu : voir outils/og.sh -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=Ubuntu:wght@400;500&family=Ubuntu+Mono&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0B0C18; }
  canvas { position: absolute; inset: 0; width: 1200px; height: 630px; image-rendering: pixelated; }
  .c { position: absolute; left: 72px; top: 64px; right: 72px; }
  .logo { width: 400px; display: block; }
  .sur { font: 26px "Ubuntu Mono", monospace; color: #9DA1AA; margin: 40px 0 10px; }
  h1 { white-space: nowrap; font: 700 52px/1.3 "Silkscreen", monospace; color: #F4F1EA; margin: 0; text-shadow: 5px 5px 0 #000; }
  h1 em { font-style: normal; color: #9B7BFF; }
  .cur { display: inline-block; width: .55em; height: .9em; background: #9B7BFF; vertical-align: -.08em; margin-left: .12em; }
  .bas { position: absolute; left: 72px; right: 72px; bottom: 40px; display: flex; justify-content: space-between;
         font: 500 26px "Ubuntu", sans-serif; color: #F4F1EA; text-shadow: 0 2px 6px #000; }
  .bas .exp { color: #D9D6CE; font-weight: 400; }
  .bas .exp b { font-weight: 500; }
</style>
</head>
<body>
<canvas id="nuit" width="300" height="158"></canvas>
<div class="c">
  <img class="logo" src="../img/logo-complet.svg" alt="">
  <p class="sur">// night code</p>
  <h1 id="t"></h1>
</div>
<div class="bas"><span class="exp" id="exp"></span><span>nitocode.com</span></div>
<script>
  const EN = new URLSearchParams(location.search).get('lang') === 'en';
  document.getElementById('t').innerHTML = EN
    ? 'I experiment for myself,<br><em>and everyone benefits</em>.<span class="cur"></span>'
    : "J'expérimente pour moi,<br><em>tout le monde en profite</em>.<span class=\"cur\"></span>";
  document.getElementById('exp').innerHTML = EN
    ? '<b style="color:#FFC83D">Noubal</b> · <b style="color:#4FD1C5">Nitosouris</b> · and the next experiments'
    : '<b style="color:#FFC83D">Noubal</b> · <b style="color:#4FD1C5">Nitosouris</b> · et les prochaines expériences';

  // Même ville que le site, tirée au sort avec une graine fixe : l'image ne change pas d'un rendu à l'autre
  let g = 7; const alea = (a, b) => { g = (g * 16807) % 2147483647; return a + (g / 2147483647) * (b - a); };
  const cv = document.getElementById('nuit'), cx = cv.getContext('2d'), W = cv.width, H = cv.height;
  const CIEL = ['#0B0C18', '#0F1024', '#141433', '#1B1840', '#251D4D'].map(c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)));
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const img = cx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    const f = (y / H) * 4, i = Math.min(3, Math.floor(f)), fr = f - i;
    for (let x = 0; x < W; x++) {
      const c = fr * 16 > BAYER[y & 3][x & 3] ? CIEL[i + 1] : CIEL[i], k = (y * W + x) * 4;
      img.data.set([c[0], c[1], c[2], 255], k);
    }
  }
  cx.putImageData(img, 0, 0);
  const px = (x, y, c, w = 1, h = 1) => { cx.fillStyle = c; cx.fillRect(x, y, w, h); };
  for (let n = 0; n < 70; n++) {
    const x = Math.floor(alea(0, W)), y = Math.floor(alea(0, H - 50)), c = alea(0, 1) < .2 ? '#9B7BFF' : '#F4F1EA';
    px(x, y, c);
    if (alea(0, 1) < .1) { px(x - 1, y, c); px(x + 1, y, c); px(x, y - 1, c); px(x, y + 1, c); }
  }
  const r = 9, mx = 262, my = 30;
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++)
    if (x * x + y * y <= r * r && (x - 3) ** 2 + (y + 2) ** 2 > (r - 1) ** 2) px(mx + x, my + y, '#F4F1EA');
  ['#F4F1EA', '#C9B8FF', '#9B7BFF', '#4B3A99', '#2B2260'].forEach((c, i) => px(200 + i * 2, 16 - i, c, 2, 1));
  // Immeubles bas, pour laisser le texte lisible ; ma fenêtre violette à droite
  for (let x = -2; x < W;) { const w = Math.floor(alea(5, 12)); px(x, H - Math.floor(alea(14, 30)), '#16142E', w, 40); x += w; }
  let mienne = null;
  for (let x = -1; x < W;) {
    const w = Math.floor(alea(7, 18)), h = Math.floor(alea(10, 24));
    px(x, H - h, '#07080F', w, h);
    for (let fx = x + 2; fx < x + w - 2; fx += 3) for (let fy = H - h + 3; fy < H - 2; fy += 4) {
      if (!mienne && fx > W * .8) { mienne = 1; px(fx, fy, '#9B7BFF'); continue; }
      if (alea(0, 1) < .22) px(fx, fy, '#F4D27A');
    }
    x += w + (alea(0, 1) < .35 ? 1 : 0);
  }
</script>
</body>
</html>
